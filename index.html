<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather ComparisonBetween Two Cities</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Weather Comparison Between Two Cities</h1>
        <p>Compare the current weather in Mississauga and Mumbai.</p>
    </header>

    <main>
        <section class="weather-card">
            <h2>Check the Weather</h2>
            <!-- The Label for city select helps the audience select a specific city from the options -->
            <label for="city-select">Choose a city:</label>

            <div class="controls">
                <select id="city-select">
                    <option value="Mississauga">Mississauga, Canada</option>
                    <option value="Mumbai">Mumbai, India</option>
                </select>
                <!-- The check-button id helps with the weather checking functionality and API requests -->
                <button id="check-button">Get Weather</button>
            </div>

            <p id="status" role="status">Loading weather...</p>

            <h3 id="city-name">Mississauga</h3>
            <p id="temperature">--°C</p> <!-- Temperature id helps display the returned value of the temperature. The --°C is initially displayed until JS updates the reported temperature -->

            <div class="weather-details">
                <p id="precipitation">Precipitation: -- mm</p> <!-- Precipitation id helps display the returned value of the precipitation -->
                <p id="cloud-cover">Cloud cover: --%</p> <!-- Cloud cover id helps display the returned value of the cloud cover -->
            </div>

            <p class="bar-label">Cloud Cover</p>

            <div class="bar-track" aria-hidden="true">
                <div id="cloud-bar"></div> <!-- Cloud bar id helps display the cloud cover as a visual indicator and makes changes related to this if and when required -->
            </div>

            <p id="weather-message"> <!-- This id is used to display and showcase the weather suggestion -->
                A weather suggestion will appear here.
            </p>

            <p id="updated-time"></p>
        </section>
    </main>

    <footer>
        <p>
            Weather data from
            <a href="https://open-meteo.com/"
               target="_blank"
               rel="noopener noreferrer">Open-Meteo</a>.
        </p>
    </footer>

    <script src="index.js"></script>

</body>
</html>
